<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать счёт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Создать счёт</h2>
    <form th:action="@{/web/admin/accounts/create}" th:object="${accountDto}" method="post">
        <div class="mb-3">
            <label>ID пользователя</label>
            <input type="number" th:field="*{userId}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Начальный баланс</label>
            <input type="number" step="0.01" th:field="*{initialBalance}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
        <a th:href="@{/web/admin/users}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
