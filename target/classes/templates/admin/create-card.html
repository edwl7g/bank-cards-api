<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать карту</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Создать карту</h2>
    <form th:action="@{/web/admin/cards/create}" th:object="${cardDto}" method="post">
        <div class="mb-3">
            <label>ID пользователя</label>
            <input type="number" th:field="*{userId}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>ID счёта</label>
            <input type="number" th:field="*{accountId}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Дата окончания (гггг-ММ-ддТЧЧ:мм)</label>
            <input type="datetime-local" th:field="*{validityPeriod}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
        <a th:href="@{/web/admin/cards}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
