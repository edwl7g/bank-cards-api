<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали карты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Детали карты</h2>
    <div th:if="${card}">
        <dl class="row">
            <dt class="col-sm-3">ID</dt>
            <dd class="col-sm-9" th:text="${card.id}"></dd>

            <dt class="col-sm-3">Номер (полный)</dt>
            <dd class="col-sm-9" th:text="${card.fullNumber}"></dd>

            <dt class="col-sm-3">Маскированный</dt>
            <dd class="col-sm-9" th:text="${card.maskedNumber}"></dd>

            <dt class="col-sm-3">Срок действия</dt>
            <dd class="col-sm-9" th:text="${card.validityPeriod}"></dd>

            <dt class="col-sm-3">Статус</dt>
            <dd class="col-sm-9" th:text="${card.cardStatus}"></dd>

            <dt class="col-sm-3">Владелец</dt>
            <dd class="col-sm-9" th:text="${card.userFullName}"></dd>

            <dt class="col-sm-3">Email владельца</dt>
            <dd class="col-sm-9" th:text="${card.userEmail}"></dd>

            <dt class="col-sm-3">Счёт</dt>
            <dd class="col-sm-9" th:text="${card.accountId}"></dd>

            <dt class="col-sm-3">Баланс</dt>
            <dd class="col-sm-9" th:text="${card.balance}"></dd>
        </dl>
    </div>
    <a th:href="@{/web/admin/cards}" class="btn btn-secondary">Назад</a>
</div>
</body>
</html>
