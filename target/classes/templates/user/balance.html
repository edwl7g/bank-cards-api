<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Баланс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Баланс карты ID: <span th:text="${cardId}"></span></h2>
    <div class="card">
        <div class="card-body">
            <h3 class="card-title" th:text="${balance} + ' руб.'"></h3>
        </div>
    </div>
    <a th:href="@{/web/user/cards}" class="btn btn-secondary mt-3">Назад</a>
</div>
</body>
</html>
