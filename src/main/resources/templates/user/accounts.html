<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои счета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1>Мои счета</h1>
        <a th:href="@{/web/dashboard}" class="btn btn-secondary">Назад</a>
    </div>

    <table class="table table-striped mt-3" th:if="${!accounts.isEmpty()}">
        <thead>
        <tr><th>ID</th><th>Баланс</th></tr>
        </thead>
        <tbody>
        <tr th:each="acc : ${accounts.content}">
            <td th:text="${acc.id}"></td>
            <td th:text="${acc.balance}"></td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${accounts.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${accounts.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/web/user/accounts(page=${accounts.number - 1})}">Назад</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Стр. ' + (${accounts.number + 1}) + ' из ' + ${accounts.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${accounts.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/web/user/accounts(page=${accounts.number + 1})}">Вперёд</a>
            </li>
        </ul>
    </nav>

    <div th:if="${accounts.isEmpty()}" class="alert alert-info">Счетов нет</div>
</div>
</body>
</html>
