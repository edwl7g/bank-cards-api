<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Bank of Thymeleaf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #141414;
            --accent-rgb: 20, 20, 20;

            --bs-primary: var(--accent);
            --bs-primary-rgb: var(--accent-rgb);
            --bs-link-color-rgb: var(--accent-rgb);
            --bs-link-hover-color-rgb: var(--accent-rgb);
        }
        .btn-primary {
            --bs-btn-bg: var(--accent);
            --bs-btn-border-color: var(--accent);
            --bs-btn-hover-bg: rgba(var(--accent-rgb), .85);
            --bs-btn-hover-border-color: rgba(var(--accent-rgb), .85);
            --bs-btn-active-bg: rgba(var(--accent-rgb), .75);
            --bs-btn-active-border-color: rgba(var(--accent-rgb), .75);
            --bs-btn-focus-shadow-rgb: var(--accent-rgb);
        }
        .form-control:focus,
        .form-check-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 .25rem rgba(var(--accent-rgb), .15);
        }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        a:hover { text-decoration: underline !important; }

        body { background-color: #24364a; }
        .bg { position: fixed; inset: 0; z-index: -1; }
        .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .bg-shade { position: absolute; inset: 0; background: linear-gradient(rgba(8,20,38,.30), rgba(8,20,38,.50)); }

        .navbar a, footer, footer span { color: #fff !important; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
        .brand-dot { width: 20px; height: 20px; border-radius: 5px; display: inline-block; background: #fff; }

        .login-card { background: rgba(255,255,255,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="bg" aria-hidden="true">
    <img alt="" decoding="async"
         src="https://images.unsplash.com/photo-1586752488885-6ce47fdfd874?auto=format&fit=crop&w=2400&q=75">
    <div class="bg-shade"></div>
</div>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
            <span class="brand-dot"></span> Bank of Thymeleaf
        </a>
        <a class="text-decoration-none" th:href="@{/web/dashboard}">Поддержка</a>
    </div>
</nav>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card login-card border-0 shadow w-100" style="max-width: 440px;">
        <div class="card-body p-4 p-md-5">

            <h1 class="h3 fw-bold mb-1">Вход в интернет-банк</h1>
            <p class="text-secondary mb-4">Введите логин и пароль</p>

            <!-- Сообщения Spring Security -->
            <div th:if="${param.error}" class="alert alert-danger py-2">
                Неверный email или пароль
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2">
                Вы вышли из системы
            </div>
            <div th:if="${param.registered}" class="alert alert-success py-2">
                Регистрация успешна! Войдите.
            </div>

            <!--
                th:action автоматически добавит CSRF-токен (Spring Security + Thymeleaf).
                Имена полей username/password — дефолтные для Spring Security formLogin.
                Если в SecurityConfig кастомные usernameParameter/passwordParameter — поменяй здесь.
            -->
            <form th:action="@{/web/login}" method="post" autocomplete="on">

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Телефон или email" autocomplete="username"
                           autocapitalize="none" spellcheck="false" maxlength="254" required autofocus>
                    <label for="username">Телефон или email</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Пароль" autocomplete="current-password" maxlength="128" required>
                    <label for="password">Пароль</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <!--
                            name="remember-me" — дефолтное имя для remember-me в Spring Security.
                            Если в SecurityConfig .rememberMe().parameter("remember") — поменяй здесь.
                            Если remember-me не настроен — оставь чекбокс как декоративный или убери вовсе.
                        -->
                        <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me" value="true">
                        <label class="form-check-label" for="remember-me">Запомнить меня</label>
                    </div>
                    <a th:href="@{/web/forgot-password}" class="small text-decoration-none">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
            </form>

            <hr class="my-4">
            <p class="text-center text-secondary mb-0">
                Нет аккаунта?
                <a th:href="@{/web/register}" class="text-decoration-none">Стать клиентом</a>
            </p>
        </div>
    </div>
</main>

<footer class="py-3">
    <div class="container d-flex flex-wrap justify-content-between gap-2 small">
        <span>© 2026 Bank of Thymeleaf</span>
        <span>Банк не запрашивает пароли и коды из СМС по телефону</span>
    </div>
</footer>

</body>
</html>
