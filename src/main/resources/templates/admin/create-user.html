<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создать пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Создать пользователя</h2>

    <!-- Глобальная ошибка (из контроллера) -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/web/admin/users/create}" th:object="${userDto}" method="post">
        <div class="mb-3">
            <label>Имя</label>
            <input type="text" th:field="*{firstName}" class="form-control" required>
            <div th:if="${#fields.hasErrors('firstName')}" class="text-danger" th:errors="*{firstName}"></div>
        </div>

        <div class="mb-3">
            <label>Фамилия</label>
            <input type="text" th:field="*{lastName}" class="form-control" required>
            <div th:if="${#fields.hasErrors('lastName')}" class="text-danger" th:errors="*{lastName}"></div>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
            <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label>Телефон</label>
            <input type="text" th:field="*{phone}" class="form-control" required placeholder="+71234567890">
            <div th:if="${#fields.hasErrors('phone')}" class="text-danger" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label>Документ</label>
            <input type="text" th:field="*{identityDocumentNumber}" class="form-control" required>
            <div th:if="${#fields.hasErrors('identityDocumentNumber')}" class="text-danger" th:errors="*{identityDocumentNumber}"></div>
        </div>

        <div class="mb-3">
            <label>Пароль</label>
            <input type="password" th:field="*{password}" class="form-control" required>
            <div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label>Роль</label>
            <select th:field="*{userRole}" class="form-select">
                <option th:each="role : ${T(com.example.bankcards.entity.enums.UserRole).values()}"
                        th:value="${role}" th:text="${role}"></option>
            </select>
            <div th:if="${#fields.hasErrors('userRole')}" class="text-danger" th:errors="*{userRole}"></div>
        </div>

        <div class="mb-3">
            <label>Статус</label>
            <select th:field="*{userStatus}" class="form-select">
                <option th:each="status : ${T(com.example.bankcards.entity.enums.UserStatus).values()}"
                        th:value="${status}" th:text="${status}"></option>
            </select>
            <div th:if="${#fields.hasErrors('userStatus')}" class="text-danger" th:errors="*{userStatus}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/web/admin/users}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
